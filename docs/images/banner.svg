<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- Animated gradient for MIRA text -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#f472b6;#818cf8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#f472b6;#818cf8;#c084fc" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#818cf8;#c084fc;#f472b6" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle glow for orbs -->
    <filter id="orbGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Line gradient -->
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#7c3aed;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="lineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#ec4899;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800;400&amp;display=swap');

    .title {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 84px;
      letter-spacing: 24px;
      fill: url(#textGrad);
      filter: url(#glow);
    }
    .subtitle {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 16px;
      letter-spacing: 6px;
      fill: #a1a1aa;
      text-transform: uppercase;
    }
    .line-accent {
      opacity: 0.5;
    }

    /* Floating orbs */
    .orb {
      filter: url(#orbGlow);
    }
    .orb1 {
      animation: float1 8s ease-in-out infinite;
    }
    .orb2 {
      animation: float2 10s ease-in-out infinite;
    }
    .orb3 {
      animation: float3 7s ease-in-out infinite;
    }
    .orb4 {
      animation: float4 9s ease-in-out infinite;
    }

    /* Scan line */
    .scan-line {
      animation: scan 6s ease-in-out infinite;
    }

    /* Pulse ring */
    .pulse-ring {
      animation: pulse 3s ease-in-out infinite;
      transform-origin: 600px 130px;
    }
    .pulse-ring2 {
      animation: pulse 3s ease-in-out infinite 1.5s;
      transform-origin: 600px 130px;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0); opacity: 0.4; }
      25% { transform: translate(15px, -20px); opacity: 0.8; }
      50% { transform: translate(-10px, -10px); opacity: 0.3; }
      75% { transform: translate(20px, 10px); opacity: 0.7; }
    }
    @keyframes float2 {
      0%, 100% { transform: translate(0, 0); opacity: 0.3; }
      33% { transform: translate(-20px, 15px); opacity: 0.7; }
      66% { transform: translate(15px, -15px); opacity: 0.5; }
    }
    @keyframes float3 {
      0%, 100% { transform: translate(0, 0); opacity: 0.5; }
      50% { transform: translate(-15px, -20px); opacity: 0.8; }
    }
    @keyframes float4 {
      0%, 100% { transform: translate(0, 0); opacity: 0.3; }
      40% { transform: translate(10px, 15px); opacity: 0.6; }
      80% { transform: translate(-20px, -5px); opacity: 0.4; }
    }
    @keyframes scan {
      0%, 100% { transform: translateX(-400px); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(400px); opacity: 0; }
    }
    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 0; }
      100% { transform: scale(0.8); opacity: 0; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" fill="#0d1117"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="300" stroke="#a78bfa" stroke-width="1" transform="translate(100,0)"/>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#a78bfa" stroke-width="1" transform="translate(200,0)"/>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#a78bfa" stroke-width="1" transform="translate(300,0)"/>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#a78bfa" stroke-width="1" transform="translate(400,0)"/>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#a78bfa" stroke-width="1" transform="translate(500,0)"/>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#a78bfa" stroke-width="1" transform="translate(600,0)"/>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#a78bfa" stroke-width="1" transform="translate(700,0)"/>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#a78bfa" stroke-width="1" transform="translate(800,0)"/>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#a78bfa" stroke-width="1" transform="translate(900,0)"/>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#a78bfa" stroke-width="1" transform="translate(1000,0)"/>
    <line x1="0" y1="0" x2="0" y2="300" stroke="#a78bfa" stroke-width="1" transform="translate(1100,0)"/>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#a78bfa" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#a78bfa" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#a78bfa" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#a78bfa" stroke-width="1"/>
  </g>

  <!-- Animated floating orbs -->
  <circle class="orb orb1" cx="150" cy="80" r="3" fill="#818cf8" opacity="0.4"/>
  <circle class="orb orb2" cx="1050" cy="220" r="2.5" fill="#c084fc" opacity="0.3"/>
  <circle class="orb orb3" cx="300" cy="240" r="2" fill="#f472b6" opacity="0.5"/>
  <circle class="orb orb4" cx="900" cy="70" r="3.5" fill="#818cf8" opacity="0.3"/>
  <circle class="orb orb1" cx="750" cy="260" r="2" fill="#c084fc" opacity="0.4"/>
  <circle class="orb orb3" cx="450" cy="50" r="2.5" fill="#f472b6" opacity="0.3"/>
  <circle class="orb orb2" cx="1100" cy="130" r="2" fill="#818cf8" opacity="0.4"/>
  <circle class="orb orb4" cx="100" cy="180" r="3" fill="#c084fc" opacity="0.3"/>

  <!-- Horizontal accent lines -->
  <line class="line-accent" x1="200" y1="170" x2="500" y2="170" stroke="url(#lineGrad1)" stroke-width="1"/>
  <line class="line-accent" x1="700" y1="170" x2="1000" y2="170" stroke="url(#lineGrad2)" stroke-width="1"/>

  <!-- Pulse rings behind text -->
  <circle class="pulse-ring" cx="600" cy="130" r="60" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.3"/>
  <circle class="pulse-ring2" cx="600" cy="130" r="60" fill="none" stroke="#ec4899" stroke-width="0.5" opacity="0.3"/>

  <!-- MIRA Title -->
  <text x="600" y="145" text-anchor="middle" class="title">MIRA</text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" class="subtitle">Autonomous Competitor Intelligence Engine</text>

  <!-- Bottom accent line -->
  <rect x="520" y="215" width="160" height="2" rx="1" fill="url(#textGrad)" opacity="0.6">
    <animate attributeName="width" values="160;200;160" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="520;500;520" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner accents -->
  <path d="M 30 30 L 30 10 L 50 10" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
  <path d="M 1170 30 L 1170 10 L 1150 10" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
  <path d="M 30 270 L 30 290 L 50 290" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.4"/>
  <path d="M 1170 270 L 1170 290 L 1150 290" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.4"/>
</svg>
